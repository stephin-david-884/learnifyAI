version: "3.9"

services:

  redis:
    image: redis:7-alpine
    container_name: learnify-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

  backend:
    build:
      context: .

    container_name: learnify-backend

    restart: unless-stopped

    depends_on:
      - redis

    env_file:
      - .env

    ports:
      - "5000:5000"

    command: node dist/server.js

  document-worker:
    build:
      context: .

    container_name: learnify-document-worker

    restart: unless-stopped

    depends_on:
      - redis

    env_file:
      - .env

    command: node dist/workers/document.worker.js